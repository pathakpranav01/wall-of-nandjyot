<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f0e9">
  <title>Wall of Nandjyot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Eagle+Lake&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
<header class="site-header">
  <div class="identity">
    <h1><span class="wall-of">Wall of</span> <span class="nandjyot">Nandjyot</span></h1>
    <p>A quiet corner for poems, photographs &amp; passing moments.</p>
  </div>
  <nav class="filters" aria-label="Artwork categories">
    <button class="filter active" data-filter="all">All <i>|</i> सर्व</button>
    <button class="filter" data-filter="words">Poetry <i>|</i> कविता</button>
    <button class="filter" data-filter="photos">Photography <i>|</i> छायाचित्रण</button>
  </nav>
</header>

<div id="immerse-hint" class="immerse-hint" role="note">Tap an artwork to immerse</div>

<main class="wall">
  <!-- V13: one continuous journey across the complete gallery -->
  <!-- light → wonder → openness → solitude → reflection → twilight → darkness → words → fire → sanctuary → light -->
  <article class="piece" data-kind="photos"><button class="art-button" aria-label="Open artwork: Light in Shadows"><img src="assets/light-in-shadows.png" loading="eager" decoding="async" alt="Light and shadows reflected across a dark interior" fetchpriority="high"></button></article>
  <article class="piece" data-kind="photos"><button class="art-button" aria-label="Open artwork: Floating Form"><img src="assets/floating-form-water.png" loading="eager" decoding="async" alt="A geometric form and its shadow floating in blue water" fetchpriority="high"></button></article>
  <article class="piece landscape" data-kind="photos"><button class="art-button" aria-label="Open artwork: Monumental Clouds"><img src="assets/monumental-clouds.png" loading="eager" decoding="async" alt="Monumental clouds rising over distant hills" fetchpriority="auto"></button></article>
  <article class="piece" data-kind="photos"><button class="art-button" aria-label="Open photograph of blue sky, clouds and a green tree"><img src="assets/blue-sky-clouds-tree.png" loading="eager" decoding="async" alt="A vivid blue sky with white clouds above the crown of a green tree" fetchpriority="auto"></button></article>
  <article class="piece" data-kind="photos"><button class="art-button" aria-label="Open artwork: Solitary Leaf"><img src="assets/solitary-leaf-shore.png" loading="eager" decoding="async" alt="A solitary leaf resting on a bright seashore" fetchpriority="auto"></button></article>
  <article class="piece" data-kind="photos words"><button class="art-button" aria-label="Open artwork: Sea and Shore"><img src="assets/sea-and-shore.png" loading="eager" decoding="async" alt="Sea and shore with the words forever entwined" fetchpriority="auto"></button></article>
  <article class="piece landscape" data-kind="photos"><button class="art-button" aria-label="Open landscape photograph"><img src="assets/passing-moment-drops.png" loading="lazy" decoding="async" alt="A close landscape photograph of water droplets reflecting a golden-blue scene" fetchpriority="low"></button></article>
  <article class="piece" data-kind="photos"><button class="art-button" aria-label="Open artwork: Barred Doorway"><img src="assets/barred-doorway.png" loading="lazy" decoding="async" alt="A barred doorway with a pair of footwear in the light" fetchpriority="low"></button></article>
  <article class="piece" data-kind="photos words"><button class="art-button" aria-label="Open artwork: Objects in the Mirror"><img src="assets/objects-in-mirror.png" loading="lazy" decoding="async" alt="A sunset and tree reflected in a car mirror" fetchpriority="low"></button></article>
  <article class="piece" data-kind="photos"><button class="art-button" aria-label="Open artwork: एक संध्याकाळ अशीही"><img src="assets/ek-sandhyakal-ashi-hi.png" loading="lazy" decoding="async" alt="एक संध्याकाळ अशीही" fetchpriority="low"></button></article>
  <article class="piece" data-kind="photos"><button class="art-button" aria-label="Open artwork: Red Crescent City"><img src="assets/red-crescent-city.png" loading="lazy" decoding="async" alt="A crescent moon above a vivid red horizon and city lights" fetchpriority="low"></button></article>
  <article class="piece" data-kind="photos"><button class="art-button" aria-label="Open artwork: Single Lamp"><img src="assets/single-lamp.png" loading="lazy" decoding="async" alt="A single lamp suspended in deep darkness" fetchpriority="low"></button></article>
  <article class="piece" data-kind="words"><button class="art-button" aria-label="Open Marathi poem with road and tree"><img src="assets/road-tree-poem.png" loading="lazy" decoding="async" alt="Marathi poem over a tree-lined road" fetchpriority="low"></button></article>
  <article class="piece" data-kind="words"><button class="art-button" aria-label="Open Marathi poem about rain and home"><img src="assets/rain-old-house-poem.png" loading="lazy" decoding="async" alt="Marathi poem over an old house in the rain" fetchpriority="low"></button></article>
  <article class="piece" data-kind="words"><button class="art-button" aria-label="Open artwork: तेजाचे अभय"><img src="assets/tejache-abhay.jpeg" loading="lazy" decoding="async" alt="तेजाचे अभय" fetchpriority="low"></button></article>
  <article class="piece" data-kind="photos words"><button class="art-button" aria-label="Open artwork: Aarti"><img src="assets/aarti.png" loading="lazy" decoding="async" alt="A vivid ceremonial aarti scene with fire and Marathi words" fetchpriority="low"></button></article>
  <article class="piece" data-kind="photos"><button class="art-button" aria-label="Open artwork: White Shrine"><img src="assets/white-shrine.png" loading="lazy" decoding="async" alt="A small white shrine surrounded by trees" fetchpriority="low"></button></article>
  <article class="piece" data-kind="words"><button class="art-button" aria-label="Open Marathi poem in a sunlit room"><img src="assets/sunlit-room-poem.png" loading="lazy" decoding="async" alt="Marathi poem in a warm sunlit room with a small plant" fetchpriority="low"></button></article>
</main>

<footer>© Nandjyot · All artwork and writing reserved</footer>
<div id="viewer" class="viewer" hidden aria-hidden="true" role="dialog" aria-modal="true" aria-label="Artwork viewer">
  <button id="close" class="close" aria-label="Close artwork">×</button>
  <div class="viewer-copyright" aria-hidden="true">© Nandjyot</div>
  <div class="viewer-stage"><img id="viewer-image" alt=""></div>
</div>
<script src="script.js?v=14"></script>
</body></html>
